name: pages

# Publishes examples/ as the Pages site root, removing the "clone to see it"
# barrier: a newcomer reads the rendered sample board at
# https://jerrylui.github.io/claude-board/sample-board.html with no clone, no
# install. examples/sample-board.html references its two siblings
# (styles-*.css, ui-*.js) as bare relative filenames (QUIRKS.md "No external
# assets -- except two bare sibling filenames"), which is exactly what resolves
# correctly once the directory is served as a site root -- no build step, the
# committed bytes are the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a push that lands mid-deploy waits rather than
# racing it, but never cancels a deploy that's already live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples
      - id: deployment
        uses: actions/deploy-pages@v4
