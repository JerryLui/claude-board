name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # macOS, because that is the only platform this tool supports: install.sh
    # generates a launchd plist and lints it with plutil, and check-install.mjs
    # exercises that against stubbed launchctl/plutil in a temp HOME.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims Node 22 or newer. This is what makes that claim true
        # rather than aspirational.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm run check
        # No install step: zero dependencies, node built-ins only.
        run: npm run check
        env:
          # Headroom for slower CI runners: check-install.mjs spawns several full
          # install.sh runs and hit the 180s local default on the Node 22 job. The
          # cap only bites when something hangs, so raising it here costs nothing
          # when healthy. Local runs keep the 180s default (test/run.mjs).
          CLAUDE_BOARD_CHECK_TIMEOUT_MS: '300000'
